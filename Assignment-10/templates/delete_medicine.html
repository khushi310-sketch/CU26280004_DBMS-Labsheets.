
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Medicine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>Delete Medicine</h1>
</header>

<main class="container">
    <p><a href="/">Home</a> | <a href="/medicines">View Medicines</a></p>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST" onsubmit="return confirm('Are you sure you want to delete this medicine?');">
        <label>Medicine ID</label>
        <input type="text" name="medicine_id" placeholder="e.g. M108" required>

        <button type="submit">Delete Medicine</button>
    </form>
</main>
</body>
</html>
