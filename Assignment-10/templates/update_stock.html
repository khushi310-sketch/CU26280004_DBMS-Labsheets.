
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Medicine Stock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>Update Medicine Stock</h1>
</header>

<main class="container">
    <p><a href="/">Home</a> | <a href="/medicines">View Medicines</a></p>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        <label>Medicine ID</label>
        <input type="text" name="medicine_id" placeholder="e.g. M101" required>

        <label>New Stock Quantity</label>
        <input type="number" name="stock" min="0" step="1" required>

        <button type="submit">Update Stock</button>
    </form>
</main>
</body>
</html>
